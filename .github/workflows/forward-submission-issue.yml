name: Forward Submission Issue to Email

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to forward manually"
        required: true
        type: number

permissions:
  issues: write

jobs:
  forward-email:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'archive-submission') ||
      startsWith(github.event.issue.title, '[Submission]') ||
      startsWith(github.event.issue.title, '[The Seam 投稿]')
    steps:
      - name: Prepare Issue payload & check SMTP configuration
        id: prepare
        uses: actions/github-script@v7
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
          TARGET_EMAIL: ${{ vars.VITE_SUBMISSION_EMAIL || 'the.seam@outlook.com' }}
          SMTP_SERVER_SECRET: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT_SECRET: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME_SECRET: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD_SECRET: ${{ secrets.SMTP_PASSWORD }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const issueNumber = Number(process.env.INPUT_ISSUE_NUMBER || context.issue.number);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("Invalid issue number.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
            const isManual = context.eventName === "workflow_dispatch";
            if (!isManual && labels.includes("forwarded-to-email")) {
              core.info(`Issue #${issueNumber} already forwarded; skipping duplicate delivery.`);
              core.setOutput("should_send", "false");
              return;
            }

            const toEmail = (process.env.TARGET_EMAIL || "").trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(toEmail)) {
              core.setFailed("VITE_SUBMISSION_EMAIL variable is missing or invalid.");
              return;
            }

            const smtpUser = (process.env.SMTP_USERNAME_SECRET || "").trim();
            const smtpPass = (process.env.SMTP_PASSWORD_SECRET || "").trim();
            const smtpHost = (process.env.SMTP_SERVER_SECRET || "smtp.office365.com").trim();
            const smtpPort = (process.env.SMTP_PORT_SECRET || "587").trim();
            const useSecure = smtpPort === "465" ? "true" : "false";

            if (!smtpUser || !smtpPass) {
              if (!labels.includes("pending-email-forward")) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ["pending-email-forward"],
                });
              }
              await core.summary
                .addHeading("SMTP Credentials Not Configured")
                .addRaw(
                  `Submission Issue #${issueNumber} could not be emailed to \`${toEmail}\` yet because ` +
                  "`SMTP_USERNAME` and/or `SMTP_PASSWORD` secrets are missing.\n\n" +
                  "Add Repository Secrets (`SMTP_SERVER`, `SMTP_PORT`, `SMTP_USERNAME`, `SMTP_PASSWORD`) " +
                  "in GitHub Settings -> Secrets and variables -> Actions, then re-run this workflow via `workflow_dispatch`.",
                )
                .write();
              core.setFailed("Missing SMTP_USERNAME or SMTP_PASSWORD repository secrets.");
              return;
            }

            const bodyText = [
              `The Seam — 新档案投稿通知 (Issue #${issue.number})`,
              `==================================================`,
              `标题: ${issue.title}`,
              `投稿人: @${issue.user?.login || "unknown"}`,
              `Issue 链接: ${issue.html_url}`,
              `创建时间: ${issue.created_at}`,
              ``,
              `--- 投稿正文 ---`,
              issue.body || "(empty)",
            ].join("\n");

            const outFile = path.join(process.env.RUNNER_TEMP || "/tmp", `issue-${issue.number}.txt`);
            fs.writeFileSync(outFile, bodyText, "utf8");

            core.setOutput("should_send", "true");
            core.setOutput("issue_number", String(issue.number));
            core.setOutput("to_email", toEmail);
            core.setOutput("smtp_host", smtpHost);
            core.setOutput("smtp_port", smtpPort);
            core.setOutput("use_secure", useSecure);
            core.setOutput("subject", `[The Seam 投稿 #${issue.number}] ${issue.title}`);
            core.setOutput("body_file", outFile);

      - name: Send email via SMTP
        if: steps.prepare.outputs.should_send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ steps.prepare.outputs.smtp_host }}
          server_port: ${{ steps.prepare.outputs.smtp_port }}
          secure: ${{ steps.prepare.outputs.use_secure == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.prepare.outputs.subject }}
          to: ${{ steps.prepare.outputs.to_email }}
          from: "The Seam Archive <${{ secrets.SMTP_USERNAME }}>"
          body: file://${{ steps.prepare.outputs.body_file }}

      - name: Mark Issue as forwarded
        if: steps.prepare.outputs.should_send == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number("${{ steps.prepare.outputs.issue_number }}");
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
            if (labels.includes("pending-email-forward")) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: "pending-email-forward",
              }).catch(() => {});
            }
            if (!labels.includes("forwarded-to-email")) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["forwarded-to-email"],
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "感谢投稿！此档案稿件已收录并自动转发至官方编辑部审核邮箱。\n\nThank you for your contribution! This submission has been recorded and automatically forwarded to the editorial review mailbox.",
            });
