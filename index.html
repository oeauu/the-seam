<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Seam | Historical Digital Archive</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("__seam_redirect");
        if (!redirect) return;
        var decoded = "/" + redirect.replace(/^\/+/, "");
        var base = "%BASE_URL%";
        var prefix = base === "/" ? "" : base.replace(/\/+$/, "");
        window.history.replaceState(null, "", prefix + decoded);
      })();
    </script>
    <meta property="og:title" content="The Seam" />
    <meta property="og:description" content="以空间与时间探索历史人物、事件及相关史料。" />
    <meta property="og:type" content="website" />
    <meta name="description" content="The Seam 是一个记录历史人物、事件及相关史料的数字档案空间，关注那些挑战传统二元叙事、揭示既有分类局限性的历史材料，通过空间与时间连接第一手文献记录。" />
    <meta name="keywords" content="The Seam, 历史档案, 数字人文, 历史地理, 原始史料, digital humanities, historical archive, primary sources" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
